name: Build Android app

# Builds the JobPilot Android app (it connects to whatever server you enter on first launch).
#  - Push a tag like v1.0.0 to build it and attach JobPilot.apk to a GitHub Release
#    (the README's download link always points at the latest release).
#  - Or run it by hand from the Actions tab; the APK is then attached to the run as an artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build APK
        working-directory: mobile
        run: |
          npm install
          node configure.mjs
          npx cap add android
          node patch-android.mjs
          npx capacitor-assets generate --android --assetPath assets || echo "icon generation skipped"
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../JobPilot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JobPilot-apk
          path: mobile/JobPilot.apk
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" mobile/JobPilot.apk --clobber
          else
            gh release create "$tag" mobile/JobPilot.apk --latest --title "JobPilot $tag" \
              --notes "Android app for the JobPilot inbox. Install JobPilot.apk, then enter your server address and passcode (see the README)."
          fi
