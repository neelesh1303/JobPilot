<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3b5bfd">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<title>JobPilot</title>
<style>
  :root { --surface:#fff; --text:#121527; --muted:#6b7190; --line:#e6e8f2; --bad:#e11d48; }
  @media (prefers-color-scheme: dark) { :root { --surface:#141728; --text:#eceefb; --muted:#9097b8; --line:#262b45; --bad:#fb7185; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:20px; font:16px/1.5 "Plus Jakarta Sans", system-ui, sans-serif; color:var(--text);
    background:radial-gradient(120% 90% at 0% 0%, #5b7cff 0%, #3b5bfd 40%, #7c3aed 100%); }
  form { width:100%; max-width:360px; background:var(--surface); border-radius:28px; padding:28px 24px; box-shadow:0 30px 60px rgba(20,10,80,.35); animation:pop .5s cubic-bezier(.2,.9,.3,1.2) both; }
  img { width:56px; height:56px; border-radius:16px; box-shadow:0 8px 20px rgba(59,91,253,.4); }
  h1 { margin:14px 0 2px; font-size:24px; font-weight:800; letter-spacing:-.4px; }
  p { margin:0 0 20px; color:var(--muted); font-size:14px; }
  input { width:100%; padding:14px 16px; font:inherit; letter-spacing:2px; border:1.5px solid var(--line); border-radius:14px; background:transparent; color:var(--text); outline:none; transition:border-color .2s; }
  input:focus { border-color:#3b5bfd; }
  button { width:100%; margin-top:12px; padding:14px; font:inherit; font-weight:800; border:0; border-radius:14px; color:#fff; cursor:pointer;
    background:linear-gradient(135deg, #3b5bfd, #8b5cf6); box-shadow:0 8px 20px rgba(59,91,253,.35); transition:transform .12s; }
  button:active { transform:scale(.98); }
  .err { color:var(--bad); font-size:14px; margin-top:12px; min-height:20px; font-weight:600; }
  @keyframes pop { from { opacity:0; transform:translateY(20px) scale(.96); } }
  @media (prefers-reduced-motion: reduce) { form { animation:none; } }
</style>
</head>
<body>
<form method="post" action="/login">
  <img src="/static/icon-192.png" alt="">
  <h1>JobPilot</h1>
  <p>Fresh jobs, tailored resumes and HR contacts, every morning.</p>
  <input type="password" name="passcode" placeholder="Passcode" autocomplete="current-password" autofocus required>
  <button type="submit">Open my inbox →</button>
  <div class="err">{{ error }}</div>
</form>
</body>
</html>
